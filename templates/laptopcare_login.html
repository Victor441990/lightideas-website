<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LaptopCare Sign In | Light Ideas Technology</title>
<link rel="icon" href="/static/images/logo.jpg" type="image/jpeg"/>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background:#000; color:#e8e8e8;
        font-family:'Segoe UI', Arial, sans-serif;
        min-height:100vh;
        display:flex; align-items:center; justify-content:center;
        padding:40px 20px;
    }
    .wrap { max-width:380px; width:100%; text-align:center; }
    .logo {
        width:80px; height:80px; border-radius:50%;
        object-fit:cover; border:3px solid #FFD700;
        margin:0 auto 20px; display:block;
        box-shadow:0 0 30px rgba(255,215,0,0.25);
    }
    .title { color:#fff; font-size:1.5em; font-weight:900; margin-bottom:24px; }
    .title span { color:#FFD700; }
    .box {
        background:#0d0d0d; border:1px solid rgba(255,215,0,0.25); border-radius:18px;
        padding:28px 24px; text-align:left;
    }
    input {
        width:100%; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px;
        padding:13px 14px; color:#fff; font-size:0.9em; margin-bottom:12px; outline:none;
    }
    input:focus { border-color:#FFD700; }
    input::placeholder { color:#555; }
    .btn {
        width:100%; background:#FFD700; color:#000; border:none; border-radius:10px;
        padding:14px; font-size:0.9em; font-weight:800; cursor:pointer; margin-top:6px;
    }
    .btn:hover { background:#e6b800; }
    .error { color:#f87171; font-size:0.8em; margin-bottom:12px; display:none; text-align:center; }
    .back-link { display:block; text-align:center; color:#888; font-size:0.8em; margin-top:20px; text-decoration:none; }
    .back-link:hover { color:#FFD700; }
</style>
</head>
<body>

<div class="wrap">
    <img src="/static/images/logo.jpg" alt="Light Ideas Technology" class="logo"/>
    <div class="title">Laptop<span>Care</span> Sign In</div>
    <div class="box">
        <div class="error" id="loginError">Incorrect email or password.</div>
        <input type="email" id="loginEmail" placeholder="Email address"/>
        <input type="password" id="loginPassword" placeholder="Password"/>
        <button class="btn" onclick="doLogin()">Sign In</button>
    </div>
    <a class="back-link" href="/laptopcare">&larr; Not a member yet? Subscribe here</a>
</div>

<script>
    function doLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const err = document.getElementById('loginError');
        err.style.display = 'none';
        if (!email || !password) {
            err.textContent = 'Enter your email and password.';
            err.style.display = 'block';
            return;
        }
        fetch('/laptopcare/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                window.location.href = '/laptopcare/dashboard';
            } else {
                err.textContent = data.error || 'Incorrect email or password.';
                err.style.display = 'block';
            }
        })
        .catch(() => {
            err.textContent = 'Something went wrong — try again.';
            err.style.display = 'block';
        });
    }
    document.getElementById('loginPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
